<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مطعم المعلم</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#241108">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#241108;color:#fff;font-family:Tajawal,Arial,sans-serif}
body{touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%}
.screen{position:fixed;inset:0;display:none;z-index:20;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:14px;background:linear-gradient(rgba(25,10,2,.72),rgba(25,10,2,.88));overflow:auto}
.screen.on{display:flex}
h1{font:700 clamp(42px,12vh,76px) Amiri,serif;color:#ffd45b;margin:0;text-shadow:0 4px #6e3307,0 0 28px #ff9f22}
h2{margin:4px 0 8px;color:#ffd45b;font-size:clamp(24px,6vh,36px)}
.sub{color:#ffe7ad;margin-bottom:10px}
.btn{border:0;border-radius:15px;padding:10px 22px;min-width:170px;font:800 16px Tajawal;background:linear-gradient(#ffd75d,#d98b13);color:#3b1c05;box-shadow:0 4px #82510b;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px #82510b}
.btn.green{background:linear-gradient(#61e28d,#209c56);color:white;box-shadow:0 4px #0d6033}
.btn.blue{background:linear-gradient(#61adff,#2869ca);color:white;box-shadow:0 4px #153f80}
.btn.purple{background:linear-gradient(#bd83ff,#7134c8);color:white;box-shadow:0 4px #421b78}
.btn.red{background:linear-gradient(#ed7564,#b72e20);color:white;box-shadow:0 4px #71150b}
.big{font-size:22px;min-width:270px;padding:14px}
.row{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
#menu .row .btn{min-width:145px}
#hud{position:fixed;z-index:15;top:0;left:0;right:0;height:46px;display:none;align-items:center;justify-content:center;gap:6px;padding:4px 7px;background:linear-gradient(#241108,#3b1a07);border-bottom:2px solid #d69a35}
body.play #hud{display:flex}
.pill{padding:4px 11px;border:2px solid #b97922;border-radius:18px;background:#0007;white-space:nowrap;font-size:14px}
.pill b{color:#ffd451}
#hud .btn{min-width:70px;padding:5px 10px;font-size:13px}
#levels{width:min(850px,94vw);display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.level{position:relative;min-height:105px;border:2px solid #e8bd61;border-radius:17px;background:linear-gradient(145deg,#8f5615,#d8941e);color:#3b1b04;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;cursor:pointer;box-shadow:0 5px #68400e}
.level .num{font-size:32px}
.level small{font-size:11px}
.level.lock{background:#3b332c;color:#aaa;border-color:#65594e;box-shadow:0 4px #211c18;cursor:default}
.level.current{outline:3px solid #fff;box-shadow:0 0 24px #ffd44d,0 5px #68400e}
.level.done:after{content:"\2713";position:absolute;top:4px;left:7px;color:#65ef91;font-size:21px}
.badge{position:absolute;right:6px;top:5px;background:#241108;color:#ffd45b;border-radius:9px;padding:2px 5px;font-size:9px}
.card{width:min(600px,94vw);background:#281306e8;border:2px solid #bd7e27;border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:12px;margin:3px 0}
.card .grow{flex:1;text-align:right}
.card b{color:#ffd45b}.card small{display:block;color:#ffe8b2;margin-top:3px}
#upList{max-height:65vh;overflow:auto}
#dailyGrid{display:grid;grid-template-columns:repeat(7,minmax(48px,76px));gap:7px}
.day{border:2px solid #a56b20;border-radius:12px;background:#291507;padding:7px 2px}
.day b{display:block;font-size:20px;color:#ffd45b}.day small{font-size:10px}.day.today{border-color:#fff;box-shadow:0 0 18px #ffd45b}
#rot{position:fixed;z-index:100;inset:0;background:#241108;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;color:#ffd45b;font-size:23px;text-align:center}
@media(orientation:portrait){#rot{display:flex}}
@media(max-width:700px){#levels{grid-template-columns:repeat(4,1fr)}.pill{font-size:12px;padding:3px 7px}.btn{min-width:140px}}
@media(max-width:500px){#levels{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
 <span class="pill" id="money"></span>
 <span class="pill" id="level"></span>
 <span class="pill" id="orders"></span>
 <span class="pill" id="time"></span>
 <button class="btn red" id="exit">خروج</button>
</div>

<div class="screen on" id="menu">
 <h1>مطعم المعلم</h1>
 <div class="sub">كبدة وسجق على أصوله 🍔</div>
 <button class="btn green big" id="play">العب</button>
 <div class="row">
  <button class="btn blue" id="levelBtn">اختار المرحلة</button>
  <button class="btn purple" id="upgradeBtn">التطويرات</button>
  <button class="btn" id="dailyBtn">المكافأة اليومية</button>
  <button class="btn" id="settingsBtn">الإعدادات</button>
 </div>
</div>

<div class="screen" id="levelsScreen">
 <h2>خريطة مطعم المعلم</h2>
 <div class="sub">كل مرحلة أصعب من اللي قبلها، والزباين بيزيدوا تلقائيًا</div>
 <div id="levels"></div>
 <button class="btn" data-back>رجوع</button>
</div>

<div class="screen" id="upgradeScreen">
 <h2>التطويرات</h2>
 <div class="pill" id="upMoney"></div>
 <div class="sub">التطويرات اختيارية، وصعوبة المراحل بتزيد لوحدها</div>
 <div id="upList"></div>
 <button class="btn" data-back>رجوع</button>
</div>

<div class="screen" id="dailyScreen">
 <h2>المكافأة اليومية</h2>
 <div class="pill" id="dailyMoney"></div>
 <div id="dailyGrid"></div>
 <button class="btn green" id="claimDaily"></button>
 <button class="btn" data-back>رجوع</button>
</div>

<div class="screen" id="settingsScreen">
 <h2>الإعدادات</h2>
 <button class="btn" id="musicBtn"></button>
 <button class="btn" id="sfxBtn"></button>
 <button class="btn" id="themeBtn">شكل المطعم: ليلي</button>
 <div class="card"><div class="grow">🎵 أغاني الموبايل<small>اختار ملفات صوت من موبايلك</small></div><input id="audioFiles" type="file" accept="audio/*" multiple></div>
 <button class="btn red" id="reset">امسح التقدم</button>
 <button class="btn" data-back>رجوع</button>
</div>

<div class="screen" id="endScreen">
 <h2 id="endTitle"></h2>
 <div class="card"><div class="grow" id="endStats"></div></div>
 <button class="btn green" id="nextLevel">المرحلة الجاية</button>
 <button class="btn" id="retry">أعيد المرحلة</button>
 <button class="btn blue" id="endLevels">اختار المرحلة</button>
</div>

<div id="rot">
 <div style="font-size:80px">📱\u21bb</div>
 <div>لف الموبايل بالعرض علشان تلعب</div>
</div>

<script>
"use strict";

/* =========================
   DATA / SAVE
========================= */
const $=id=>document.getElementById(id);
const cv=$("cv"),ctx=cv.getContext("2d");
const SAVE_KEY="moallem1";

const DEFAULT={
 money:0, current:1, unlocked:1,
 music:true, sfx:true, theme:"night",
 daily:{day:0,next:0},
 owned:["baladi","liver","onion"],
 upgrades:{pat:0,tip:0,tbl:0,exp:0}
};

let S=loadSave();
function loadSave(){
 try{
  const x=JSON.parse(localStorage.getItem(SAVE_KEY));
  if(!x)return structuredClone(DEFAULT);
  return {
   ...structuredClone(DEFAULT),...x,
   upgrades:{...DEFAULT.upgrades,...(x.upgrades||{})},
   daily:{...DEFAULT.daily,...(x.daily||{})}
  };
 }catch(e){return structuredClone(DEFAULT)}
}
function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(S))}

/* =========================
   INGREDIENTS
========================= */
const ING={
 baladi:{name:"عيش بلدي",type:"bread",price:0},
 fino:{name:"فينو",type:"bread",price:150},
 liver:{name:"كبدة",type:"meat",price:0},
 sogo:{name:"سجق",type:"meat",price:120},
 egg:{name:"بيض",type:"extra",price:140},
 onion:{name:"بصل",type:"extra",price:0},
 pepper:{name:"فلفل",type:"extra",price:80},
 tahini:{name:"طحينة",type:"extra",price:100},
 pickle:{name:"مخلل",type:"extra",price:90},
 potato:{name:"بطاطس",type:"extra",price:130},
 cheese:{name:"جبنة",type:"extra",price:160}
};

const UNLOCK={
 1:["baladi","liver","onion"],
 2:["sogo","pepper"],
 3:["tahini","pickle","potato"],
 4:["fino"],
 5:["egg"],
 6:["cheese"]
};

const LEVEL_INFO=[
 "البداية",
 "سجق وفلفل",
 "الطعم بقى أقوى",
 "3 زباين",
 "فينو جديد",
 "زحمة المطعم",
 "بيض وجبنة",
 "سرعة نار",
 "الطابور كبر",
 "المعلم الكبير"
];

function availableIngredients(){
 return S.owned.slice().sort((a,b)=>{
  const order={bread:0,meat:1,extra:2};
  return order[ING[a].type]-order[ING[b].type];
 });
}

/* =========================
   GAME STATE
========================= */
let mode="menu",G=null;
let W=800,H=450,dpr=1,scale=1,ox=0,oy=0;
let pointer=null,particles=[],texts=[],floaters=[];
let last=0,clock=0;

function resize(){
 dpr=Math.min(devicePixelRatio||1,2);
 cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;
 const top=mode==="play"?46:0;
 const w=innerWidth,h=innerHeight-top;
 scale=Math.min(w/800,h/450);
 ox=(w-800*scale)/2;
 oy=top+(h-450*scale)/2;
}
addEventListener("resize",resize);

function worldPos(e){
 return [(e.clientX-ox)/scale,(e.clientY-oy)/scale];
}

/* =========================
   LEVEL DIFFICULTY
========================= */
function levelConfig(n){
 const customers=Math.min(10,1+Math.floor((n+1)/2));
 const orders=4+n*2;
 const time=Math.max(65,120-n*4);
 const patience=Math.max(16,42-n*2.1);
 const spawn=Math.max(1.15,5.5-n*.38);
 const itemCount=Math.min(3,1+Math.floor(n/3));
 return {customers,orders,time,patience,spawn,itemCount};
}

/* =========================
   ORDER SYSTEM
========================= */
function pick(a){return a[Math.floor(Math.random()*a.length)]}

function makeOrder(level){
 const av=availableIngredients();
 const breads=av.filter(k=>ING[k].type==="bread");
 const meats=av.filter(k=>ING[k].type==="meat");
 const extras=av.filter(k=>ING[k].type==="extra");
 let count=levelConfig(level).itemCount;
 const items=[pick(meats)];
 const shuffled=extras.slice().sort(()=>Math.random()-.5);
 items.push(...shuffled.slice(0,count));
 return {bread:pick(breads),items};
}

function orderText(o){
 return "عايز "+ING[o.bread].name+" بـ "+o.items.map(x=>ING[x].name).join(" و ");
}

/* =========================
   CHARACTERS
========================= */
const SKINS=["#f0c5a0","#d99d70","#b87850","#875637","#e7b18b"];
const SHIRTS=["#2671c9","#b9362a","#3b945d","#d2a62f","#7447a5","#eee6d7"];
function customerVisual(){
 return {
  skin:pick(SKINS),shirt:pick(SHIRTS),
  hair:pick(["#251812","#56351f","#111","#8b542d"]),
  kind:Math.floor(Math.random()*5)
 };
}

/* =========================
   GAME START
========================= */
function startLevel(n){
 if(n>S.unlocked)return;
 const cfg=levelConfig(n);
 S.current=n;save();
 G={
  n,cfg,t:0,served:0,wrong:0,lost:0,
  spawned:0,resolved:0,earned:0,bonus:0,combo:0,
  customers:[],grill:[null,null],sandwich:null,
  ingredients:availableIngredients(),spawnTimer:cfg.spawn,
  message:"اسحب العيش على الطربيزة"
 };
 mode="play";document.body.classList.add("play");
 hideScreens();resize();updateHud();
}

function finish(winByTime=false){
 if(!G)return;
 const needed=Math.ceil(G.cfg.orders*.6);
 const win=!winByTime&&G.served>=needed;
 if(win && G.n===S.unlocked && S.unlocked<10)S.unlocked++;
 save();
 mode="end";document.body.classList.remove("play");
 $("endTitle").textContent=win?"المرحلة خلصت!":winByTime?"الوقت خلص!":"المحاولة خلصت";
 $("endStats").innerHTML=
  "الطلبات: <b>"+G.served+"/"+G.cfg.orders+"</b><br>"+
  "الفلوس: <b>+"+G.earned+" جنيه</b><br>"+
  "البونص: <b>+"+G.bonus+" جنيه</b><br>"+
  "الغلطات: <b>"+G.wrong+"</b><br>"+
  "الزبائن اللي مشيوا: <b>"+G.lost+"</b><br>"+
  "معاك دلوقتي: <b>"+S.money+" جنيه</b><br>"+
  "الدقة: <b>"+Math.round(G.served/Math.max(1,G.served+G.wrong+G.lost)*100)+"%</b>"+
  (win?"<br><b>\ud83d\udd25 المرحلة اللي بعدها اتفتحت!</b>":"<br>لازم تخلص 60% من الطلبات.");
 $("nextLevel").style.display=win&&G.n<10?"block":"none";
 $("retry").style.display=win?"none":"block";
 show("endScreen");resize();
}

/* =========================
   UI
========================= */
function hideScreens(){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("on"))}
function show(id){
 hideScreens();
 if(id)$(`${id}`).classList.add("on");
 mode=id==="endScreen"?"end":"menu";
 document.body.classList.remove("play");
 resize();
}
function updateHud(){
 if(!G)return;
 $("money").innerHTML="\ud83d\udcb0 <b>"+S.money+"</b>";
 $("level").innerHTML="\u2b50 ليفل <b>"+G.n+"</b>";
 $("orders").innerHTML="\ud83c\udf54 <b>"+G.served+"/"+G.cfg.orders+"</b>";
 const r=Math.max(0,Math.ceil(G.cfg.time-G.t));
 $("time").innerHTML="\u23f1\ufe0f <b>"+Math.floor(r/60)+":"+String(r%60).padStart(2,"0")+"</b>";
}
function renderLevels(){
 const box=$("levels");box.innerHTML="";
 for(let i=1;i<=10;i++){
  const b=document.createElement("button");
  const locked=i>S.unlocked;
  b.className="level"+(locked?" lock":"")+(i===S.current?" current":"")+(i<S.unlocked?" done":"");
  b.innerHTML=locked?
   '<span style="font-size:28px">\ud83d\udd12</span><small>مقفولة</small>':
   '<span class="num">'+i+'</span><small>'+LEVEL_INFO[i-1]+'</small><span class="badge">'+levelConfig(i).customers+' زبون</span>';
  if(!locked)b.onclick=()=>startLevel(i);
  box.appendChild(b);
 }
}
function renderUpgrades(){
 const list=$("upList");list.innerHTML="";
 $("upMoney").innerHTML="معاك <b>"+S.money+"</b> جنيه";
 const ups=[
  ["pat","زبائن صبورين","الزبون يستنى وقت أطول",150,5],
  ["tip","بقشيش أكتر","+15% دخل الطلب",200,5],
  ["tbl","طربيزة زيادة","تزود عدد الزباين المسموحين",300,3],
  ["exp","توسعة المطعم","+5% فلوس وشكل المطعم يكبر",400,3]
 ];
 ups.forEach(([k,n,d,p,max])=>{
  const lv=S.upgrades[k],price=p*(lv+1);
  const c=document.createElement("div");c.className="card";
  const disabled=lv>=max||S.money<price;
  c.innerHTML='<div class="grow"><b>'+n+'</b><small>'+d+'</small><small>المستوى '+lv+'/'+max+'</small></div>';
  const b=document.createElement("button");b.className="btn "+(disabled?"":"green");
  b.textContent=lv>=max?"مكتمل":"شراء "+price;
  b.disabled=disabled;
  b.onclick=()=>{S.money-=price;S.upgrades[k]++;save();renderUpgrades()};
  c.appendChild(b);list.appendChild(c);
 });
 const title=document.createElement("h2");title.textContent="المكونات";list.appendChild(title);
 Object.keys(ING).filter(k=>ING[k].price).forEach(k=>{
  const own=S.owned.includes(k),need=Object.keys(UNLOCK).find(l=>UNLOCK[l].includes(k));
  const locked=!own&&S.unlocked<+need;
  const c=document.createElement("div");c.className="card";
  c.innerHTML='<div style="font-size:32px">'+ingredientEmoji(k)+'</div><div class="grow"><b>'+ING[k].name+'</b><small>'+(
   own?"موجود في المطعم":locked?"يتفتح عند ليفل "+need:"مكون جديد"
  )+'</small></div>';
  const b=document.createElement("button");b.className="btn "+(!own&&!locked&&S.money>=ING[k].price?"green":"");
  b.textContent=own?"موجود":locked?"مقفول":"شراء "+ING[k].price;
  b.disabled=own||locked||S.money<ING[k].price;
  b.onclick=()=>{S.money-=ING[k].price;S.owned.push(k);save();renderUpgrades()};
  c.appendChild(b);list.appendChild(c);
 });
}
function renderDaily(){
 const box=$("dailyGrid");box.innerHTML="";
 const base=Math.floor(S.daily.day/7)*7+1;
 for(let i=0;i<7;i++){
  const d=base+i,c=document.createElement("div");
  c.className="day"+(d===S.daily.day+1?" today":"");
  c.innerHTML="<small>يوم "+d+"</small><b>"+Math.min(150,d*10)+"</b><small>جنيه</small>";
  box.appendChild(c);
 }
 $("dailyMoney").innerHTML="معاك <b>"+S.money+"</b> جنيه";
 const ready=Date.now()>=S.daily.next;
 $("claimDaily").disabled=!ready;
 $("claimDaily").textContent=ready?"استلم المكافأة":"المكافأة لسه بدري";
}
function renderSettings(){
 $("musicBtn").textContent="الموسيقى: "+(S.music?"شغالة":"مقفولة");
 $("sfxBtn").textContent="المؤثرات: "+(S.sfx?"شغالة":"مقفولة");
}
$("play").onclick=()=>startLevel(Math.min(S.unlocked,10));
$("levelBtn").onclick=()=>{renderLevels();show("levelsScreen")};
$("upgradeBtn").onclick=()=>{renderUpgrades();show("upgradeScreen")};
$("dailyBtn").onclick=()=>{renderDaily();show("dailyScreen")};
$("settingsBtn").onclick=()=>{renderSettings();show("settingsScreen")};
document.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>show("menu"));
$("exit").onclick=()=>{G=null;show("levelsScreen");renderLevels()};
$("nextLevel").onclick=()=>startLevel(G.n+1);
$("retry").onclick=()=>startLevel(G.n);
$("endLevels").onclick=()=>{renderLevels();show("levelsScreen")};
$("musicBtn").onclick=()=>{S.music=!S.music;save();renderSettings()};
$("sfxBtn").onclick=()=>{S.sfx=!S.sfx;save();renderSettings()};
$("themeBtn").onclick=()=>{S.theme=S.theme==="night"?"warm":"night";save()};
/* المسح بيمسح الإعدادات بس - الليفل والتطويرات والفلوس مبتمسحش */
$("reset").onclick=()=>{
 if(confirm("هتمسح الإعدادات بس (موسيقى / مؤثرات / شكل المطعم).\nالليفلات والتطويرات والفلوس هتفضل زي ما هي. متأكد؟")){
  S.music=DEFAULT.music;
  S.sfx=DEFAULT.sfx;
  S.theme=DEFAULT.theme;
  save();renderSettings();
 }
};
$("claimDaily").onclick=()=>{
 if(Date.now()<S.daily.next)return;
 const amount=Math.min(150,(S.daily.day+1)*10);
 S.money+=amount;S.daily.day++;
 const n=new Date();n.setHours(24,0,0,0);S.daily.next=n.getTime();
 save();renderDaily();burst(350,170,"+"+amount+" جنيه");
};

/* =========================
   DRAWING HELPERS
========================= */
function roundRect(c,x,y,w,h,r,fill,stroke){
 c.beginPath();c.roundRect(x,y,w,h,r);
 if(fill){c.fillStyle=fill;c.fill()}
 if(stroke){c.strokeStyle=stroke;c.stroke()}
}
function ingredientEmoji(k){
 return {baladi:"\ud83e\uded3",fino:"\ud83e\udd56",liver:"\ud83e\udd69",sogo:"\ud83c\udf2d",egg:"\ud83e\udd5a",onion:"\ud83e\uddc5",pepper:"\ud83c\udf36\ufe0f",tahini:"\ud83e\udd63",pickle:"\ud83e\udd52",potato:"\ud83c\udf5f",cheese:"\ud83e\uddc0"}[k]||"\ud83c\udf74";
}
function drawIngredient(c,k,x,y,r,rot=0){
 c.save();c.translate(x,y);c.rotate(rot);
 const colors={
  liver:"#702c20",sogo:"#a83b24",onion:"#f4d9ec",pepper:"#3d9e42",
  tahini:"#e8d29b",pickle:"#6d9d2d",potato:"#e5b941",egg:"#fff4d0",cheese:"#f4cf38"
 };
 if(k==="baladi"||k==="fino"){
  c.fillStyle=k==="baladi"?"#dba55b":"#e0ae62";
  c.strokeStyle="#9a6123";c.lineWidth=3;
  c.beginPath();c.ellipse(0,0,r,r*.48,0,0,Math.PI*2);c.fill();c.stroke();
  c.fillStyle="#f5d49a";c.beginPath();c.ellipse(0,-2,r*.76,r*.28,0,0,7);c.fill();
 }else if(k==="egg"){
  c.fillStyle="#fff";c.strokeStyle="#aaa";c.lineWidth=2;c.beginPath();c.ellipse(0,0,r,r*.78,0,0,7);c.fill();c.stroke();
  c.fillStyle="#f3a51b";c.beginPath();c.arc(0,0,r*.34,0,7);c.fill();
 }else if(k==="cheese"){
  c.fillStyle=colors[k];c.beginPath();c.moveTo(-r,-r*.6);c.lineTo(r,-r*.6);c.lineTo(r*.7,r*.6);c.lineTo(-r,r*.6);c.closePath();c.fill();
 }else{
  c.fillStyle=colors[k]||"#c55";c.strokeStyle="#512515";c.lineWidth=2;
  for(let i=0;i<3;i++){c.beginPath();c.ellipse((i-1)*r*.55,Math.sin(i)*r*.18,r*.55,r*.32,Math.sin(i),0,7);c.fill();c.stroke()}
 }
 c.restore();
}

/* =========================
   PARTICLES
========================= */
function burst(x,y,text){
 for(let i=0;i<25;i++)particles.push({
  x,y,vx:(Math.random()-.5)*280,vy:-Math.random()*250-50,
  life:1.2,size:3+Math.random()*5,color:pick(["#ffd45b","#fff","#65e892","#ff9d37"])
 });
 texts.push({x,y,text,life:1.5});
}
function smoke(x,y){
 particles.push({x:x+(Math.random()-.5)*18,y,vx:(Math.random()-.5)*12,vy:-25-Math.random()*25,life:.8,size:4+Math.random()*5,color:"#ffffff88"});
}

/* =========================
   RESTAURANT DRAWING
========================= */
function drawRestaurant(){
 const g=ctx;
 g.fillStyle="#b96e34";g.fillRect(0,0,W,H);
 const wall=g.createLinearGradient(0,0,0,280);wall.addColorStop(0,"#f0c37c");wall.addColorStop(1,"#bd783b");
 g.fillStyle=wall;g.fillRect(0,0,W,270);

 // brick pattern
 g.strokeStyle="#8f542b55";g.lineWidth=2;
 for(let y=30;y<260;y+=32)for(let x=(y/32%2)*30;x<800;x+=60){
  g.strokeRect(x,y,60,32);
 }

 // sign
 g.shadowColor="#ffd34d";g.shadowBlur=S.upgrades.exp*7;
 roundRect(g,245,18,310,58,17,"#225b49","#ffd45b");
 g.shadowBlur=0;
 g.fillStyle="#ffd45b";g.font="700 34px Amiri";g.textAlign="center";g.fillText("مطعم المعلم",400,57);

 // hanging lamps
 const lamps=3+S.upgrades.exp;
 for(let i=0;i<lamps;i++){
  const x=70+i*(660/Math.max(1,lamps-1));
  g.strokeStyle="#513018";g.lineWidth=2;g.beginPath();g.moveTo(x,0);g.lineTo(x,32);g.stroke();
  g.fillStyle="#ffb52d";g.shadowColor="#ffb52d";g.shadowBlur=20;
  roundRect(g,x-11,30,22,30,7,"#ffb52d");
  g.shadowBlur=0;
 }

 // back shelves
 g.fillStyle="#74431f";g.fillRect(30,92,175,120);
 g.fillStyle="#8e582a";g.fillRect(42,105,151,9);g.fillRect(42,150,151,9);
 ["\ud83c\udf45","\ud83e\uddc5","\ud83c\udf36\ufe0f","\ud83e\udd52","\ud83e\uddc0"].forEach((e,i)=>{g.font="24px sans-serif";g.fillText(e,57+i*28,142)});
 ["\ud83e\udd63","\ud83c\udf5e","\ud83e\udd69"].forEach((e,i)=>{g.fillText(e,65+i*40,190)});

 // floor/counter
 g.fillStyle="#6e3e1d";g.fillRect(0,260,800,190);
 g.fillStyle="#9e6530";g.fillRect(0,260,800,7);
 g.strokeStyle="#4d2b16";g.lineWidth=2;
 for(let y=285;y<450;y+=30){g.beginPath();g.moveTo(0,y);g.lineTo(800,y+12);g.stroke()}
 for(let x=0;x<800;x+=65){g.beginPath();g.moveTo(x,260);g.lineTo(x+25,450);g.stroke()}

 // work counter
 g.fillStyle="#b8793e";g.fillRect(110,250,440,120);
 g.fillStyle="#d79a55";g.fillRect(110,250,440,8);
 g.strokeStyle="#72431f";g.lineWidth=3;g.strokeRect(110,250,440,120);

 // grill
 roundRect(g,135,272,140,65,9,"#29282b","#777");
 g.fillStyle="#e95d18";g.globalAlpha=.55+.15*Math.sin(clock*8);roundRect(g,145,281,120,45,6,"#ff6a16");g.globalAlpha=1;
 g.strokeStyle="#171717";g.lineWidth=4;
 for(let x=153;x<260;x+=15){g.beginPath();g.moveTo(x,278);g.lineTo(x,325);g.stroke()}
 g.fillStyle="#ffe2a4";g.font="800 12px Tajawal";g.fillText("الشواية",205,354);

 // trash
 roundRect(g,480,337,52,40,7,"#56616c","#303841");
 g.fillStyle="#fff";g.font="800 10px Tajawal";g.fillText("رمي",506,362);

 // delivery plate
 g.fillStyle="#e9d9b5";g.beginPath();g.ellipse(650,300,78,16,0,0,7);g.fill();
 g.fillStyle="#56300f";g.font="800 13px Tajawal";g.fillText("سلّم الطلب هنا",650,304);

 // ingredient shelf
 g.fillStyle="#4b2a12";g.fillRect(0,0,105,450);
 const av=G?G.ingredients:availableIngredients();
 av.forEach((k,i)=>{
  const col=Math.floor(i/5),row=i%5,x=53+col*52,y=100+row*64;
  roundRect(g,x-22,y-24,44,50,8,ING[k].type==="bread"?"#82551e":"#183d72","#d9b56d");
  drawIngredient(g,k,x,y-3,15,0);
  g.fillStyle="#fff";g.font="800 9px Tajawal";g.fillText(ING[k].name,x,y+19);
 });
}

/* =========================
   SANDWICH
========================= */
function drawSandwich(){
 if(!G||!G.sandwich)return;
 const s=G.sandwich,x=335,y=405;
 gShadow(ctx,x,y,90);
 ctx.save();ctx.translate(x,y);
 const bread=s.bread;
 ctx.fillStyle=G.sandwich.folded?"#d79b4f":"#e3ad62";
 ctx.strokeStyle="#8d5b22";ctx.lineWidth=3;
 ctx.beginPath();ctx.ellipse(0,0,92,25,0,0,7);ctx.fill();ctx.stroke();
 if(!s.folded){
  ctx.fillStyle="#f5d49a";ctx.beginPath();ctx.ellipse(0,-8,75,17,0,0,7);ctx.fill();
 }
 s.items.forEach((it,i)=>{
  const a=i*.7;
  const px=it.px!==undefined?it.px:Math.cos(a)*45;
  const py=it.py!==undefined?it.py:Math.sin(a)*10-8;
  drawIngredient(ctx,it.k,px,py,9,it.rot);
 });
 if(s.folded){
  ctx.fillStyle="#d99e55";ctx.beginPath();ctx.ellipse(0,-14,91,23,0,0,7);ctx.fill();ctx.stroke();
 }
 ctx.restore();
}
function gShadow(c,x,y,r){
 c.fillStyle="#0005";c.beginPath();c.ellipse(x,y,r,r*.25,0,0,7);c.fill();
}

/* =========================
   CUSTOMER DRAWING
========================= */
function drawCustomer(c){
 const v=c.v,x=c.x,y=220;
 ctx.save();ctx.translate(x,y);
 ctx.fillStyle=v.shirt;ctx.beginPath();ctx.ellipse(0,72,42,55,0,0,7);ctx.fill();
 ctx.fillStyle=v.skin;ctx.beginPath();ctx.arc(0,10,27,0,7);ctx.fill();
 ctx.fillStyle=v.hair;ctx.beginPath();ctx.arc(0,0,27,Math.PI,7);ctx.fill();
 ctx.fillStyle="#21150e";ctx.beginPath();ctx.arc(-9,12,3,0,7);ctx.arc(9,12,3,0,7);ctx.fill();
 ctx.strokeStyle="#6d3025";ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,25,9,0,Math.PI);ctx.stroke();
 ctx.fillStyle="#ff8080aa";ctx.beginPath();ctx.arc(-17,22,6,0,7);ctx.arc(17,22,6,0,7);ctx.fill();

 // patience bar
 const f=Math.max(0,c.pat/c.max);
 ctx.fillStyle="#222";roundRect(ctx,-34,-45,68,8,4,"#222");
 ctx.fillStyle=f>.5?"#4fe17a":f>.25?"#f3c047":"#e64b42";
 roundRect(ctx,-33,-44,66*f,6,3,ctx.fillStyle);

 // order bubble
 const order=c.order;
 const bw=70+order.items.length*22;
 roundRect(ctx,-bw/2,-95,bw,42,10,"#fffffff2");
 ctx.fillStyle="#3b210e";ctx.font="800 12px Tajawal";ctx.fillText("عايز",0,-78);
 drawIngredient(ctx,order.bread,-20,-75,8);
 order.items.forEach((k,i)=>drawIngredient(ctx,k,7+i*18,-75,7));
 ctx.restore();
}

/* =========================
   INPUT
========================= */
function ingredientHit(x,y){
 if(!G)return null;
 const av=G.ingredients;
 for(let i=0;i<av.length;i++){
  const col=Math.floor(i/5),row=i%5,px=53+col*52,py=100+row*64;
  if(Math.hypot(x-px,y-py)<27)return av[i];
 }
 return null;
}
function tableHit(x,y){return x>115&&x<555&&y>250&&y<420}
function sandwichHit(x,y){return G&&G.sandwich&&Math.hypot(x-335,y-405)<105}
function grillHit(x,y){return x>135&&x<275&&y>270&&y<340}

cv.addEventListener("pointerdown",e=>{
 if(mode!=="play")return;
 const [x,y]=worldPos(e);
 pointer={x,y,kind:null,data:null};
 const k=ingredientHit(x,y);
 if(k){
  pointer.kind="ingredient";pointer.data=k;cv.setPointerCapture(e.pointerId);return;
 }
 if(G){
  for(let i=0;i<2;i++){
   const o=G.grill[i];
   if(o&&Math.hypot(x-(205+i*45),y-302)<28){
    pointer={x,y,kind:"grill",data:i};
    cv.setPointerCapture(e.pointerId);
    return;
   }
  }
 }
 if(G.sandwich&&sandwichHit(x,y)){
  pointer.kind="sandwich";cv.setPointerCapture(e.pointerId);return;
 }
});

cv.addEventListener("pointermove",e=>{
 if(!pointer)return;
 const [x,y]=worldPos(e);pointer.x=x;pointer.y=y;
});

cv.addEventListener("pointerup",e=>{
 if(!pointer||mode!=="play"){pointer=null;return}
 const [x,y]=worldPos(e);
 if(pointer.kind==="ingredient")dropIngredient(pointer.data,x,y);
 else if(pointer.kind==="grill")dropGrill(pointer.data,x,y);
 else if(pointer.kind==="sandwich")dropSandwich(x,y);
 pointer=null;
});

function dropIngredient(k,x,y){
 if(ING[k].type==="bread"){
  if(!tableHit(x,y)){wrongAction("حط العيش على الطربيزة");return}
  if(G.sandwich){wrongAction("الساندوتش موجود");return}
  G.sandwich={bread:k,items:[],folded:false};
  burst(335,385,"عيش جاهز");
  G.message="اسحب الكبدة أو السجق على الشواية";
  return;
 }

 // meat must grill first
 if(ING[k].type==="meat"){
  if(!grillHit(x,y)){wrongAction("حط الكبدة أو السجق على الشواية");return}
  if(G.grill.some(o=>o&&o.k===k)){wrongAction("ده بيتشوي بالفعل");return}
  const slot=G.grill.findIndex(o=>!o);
  if(slot<0){wrongAction("الشواية مليانة");return}
  G.grill[slot]={k:k,t:0};
  burst(205+slot*45,300,"\ud83d\udd25");
  return;
 }

 // extras go on sandwich
 if(!G.sandwich){wrongAction("حط العيش الأول");return}
 if(!sandwichHit(x,y)){wrongAction("حط المكون جوه الرغيف");return}
 const customer=G.customers.find(c=>c.active&&c.order.items.includes(k));
 if(!customer){wrongAction("المكون ده مش مطلوب");return}
 if(G.sandwich.items.some(i=>i.k===k)){wrongAction("حطيته قبل كده");return}
 G.sandwich.items.push({k:k,rot:(Math.random()-.5)*.6,px:(G.sandwich.items.length-1.5)*36,py:(Math.random()-.5)*10});
 burst(335,400,ING[k].name);
 G.message="كمّل الطلب وبعدين اطوي الساندوتش";
}

/* سحب الأكل المستوي من الشواية وحطه جوه العيش */
function dropGrill(i,x,y){
 const o=G.grill[i];
 if(!o)return;
 // الرمي في الزبالة
 if(x>480&&x<532&&y>330&&y<385){
  G.grill[i]=null;burst(x,y,"اترمى");
  G.message="اسحب أكل تاني على الشواية";
  return;
 }
 if(!G.sandwich){wrongAction("حط العيش الأول");return}
 if(!sandwichHit(x,y)){wrongAction("حطه جوه الرغيف");return}
 if(o.t<4){wrongAction("لسه ني! استنى يستوي شوية");return}
 if(o.t>=8.5){wrongAction("اتحرق! ارميه في الزبالة");return}
 const customer=G.customers.find(c=>c.active&&c.order.items.includes(o.k));
 if(!customer){wrongAction("المكون ده مش مطلوب");return}
 if(G.sandwich.items.some(s=>s.k===o.k)){wrongAction("حطيته قبل كده");return}
 // الأكل المستوي يتوزّع جوه العيش أو الفينو
 for(let p=0;p<4;p++)G.sandwich.items.push({
  k:o.k,
  rot:(Math.random()-.5)*.7,
  px:(p-1.5)*36,
  py:(Math.random()-.5)*10
 });
 G.grill[i]=null;
 G.message="اتوزّع جوه العيش! اكمّل باقي المكونات";
 burst(335,400,ING[o.k].name);
 if(S.sfx)beep(700,.08);
}

function dropSandwich(x,y){
 if(!G.sandwich)return;
 if(!G.sandwich.folded){
  if(G.sandwich.items.length===0){wrongAction("حط المكونات الأول");return}
  const expected=G.customers.find(c=>c.active);
  if(expected){
   const wanted=[...expected.order.items];
   const got=G.sandwich.items.map(i=>i.k);
   if(wanted.some(k=>!got.includes(k))){wrongAction("لسه فيه مكونات ناقصة");return}
  }
  G.sandwich.folded=true;
  G.message="اسحب الساندوتش للزبون";
  burst(335,385,"جاهز!");
  return;
 }

 const c=G.customers.filter(c=>c.active&&x>c.x-65&&x<c.x+65).sort((a,b)=>Math.abs(a.x-x)-Math.abs(b.x-x))[0];
 if(!c){wrongAction("اسحبه للزبون");return}
 serveCustomer(c);
}

function wrongAction(msg){
 G.wrong++;G.combo=0;G.message=msg;
 texts.push({x:400,y:190,text:msg,life:1.2,color:"#ff9a88"});
 if(S.sfx)beep(120,.08);
}

/* =========================
   SERVE / ORDERS
========================= */
function serveCustomer(c){
 const wanted=[...c.order.items].sort(),got=G.sandwich.items.map(i=>i.k).sort();
 if(c.order.bread!==G.sandwich.bread||wanted.join(",")!==got.join(",")){
  wrongAction("ده مش طلب الزبون!");
  c.pat=Math.max(2,c.pat-8);
  return;
 }
 G.served++;G.resolved++;c.active=false;c.going=true;
 G.combo++;
 const base=8+G.n*2+G.sandwich.items.length*4;
 const comboBonus=Math.min(20,G.combo*2);
 const tip=Math.round(base*(.15*S.upgrades.tip)+base*(c.pat/c.max)*.35+comboBonus);
 const total=Math.round(base+tip);
 S.money+=total;G.earned+=base;G.bonus+=tip;save();
 burst(c.x,165,"+"+total+" جنيه");
 G.sandwich=null;
 G.message="تسلم إيدك!";
}

function spawnCustomer(){
 const cfg=G.cfg;
 const active=G.customers.filter(c=>c.active).length;
 const maxCustomers=Math.min(6,cfg.customers+S.upgrades.tbl);
 if(active>=maxCustomers)return;
 if(G.spawned>=cfg.orders)return;
 const c={
  x:760+Math.random()*80,
  targetX:620-active*105,
  pat:cfg.patience*(1+.12*S.upgrades.pat),
  max:cfg.patience*(1+.12*S.upgrades.pat),
  order:makeOrder(G.n),
  active:true,going:false,v:customerVisual()
 };
 G.customers.push(c);G.spawned++;
}

/* =========================
   UPDATE
========================= */
function update(dt){
 if(!G)return;
 G.t+=dt;
 if(G.t>=G.cfg.time){finish(true);return}

 // grill cooking
 G.grill.forEach((o,i)=>{
  if(!o)return;
  const was=o.t;
  o.t+=dt;
  if(was<4&&o.t>=4){
   texts.push({x:205+i*45,y:258,text:"استوت!",life:1.1,color:"#7bff9e"});
   if(S.sfx)beep(900,.06);
  }
  if(was<8.5&&o.t>=8.5){
   texts.push({x:205+i*45,y:258,text:"اتحرقت!",life:1.1,color:"#ff806d"});
   if(S.sfx)beep(110,.15);
  }
  if(Math.random()<dt*4)smoke(205+i*45,285);
 });

 // customers automatically increase with level
 if(G.spawnTimer>0)G.spawnTimer-=dt;
 if(G.spawnTimer<=0){
  spawnCustomer();
  G.spawnTimer=G.cfg.spawn;
 }

 for(const c of G.customers){
  if(c.active){
   c.x+=(c.targetX-c.x)*Math.min(1,dt*4);
   c.pat-=dt;
   if(c.pat<=0){
    c.active=false;c.going=true;G.lost++;G.resolved++;G.combo=0;
    texts.push({x:c.x,y:160,text:"زهقت ومشي!",life:1.3,color:"#ff806d"});
   }
  }else if(c.going){
   c.x+=dt*180;
  }
 }

 G.customers=G.customers.filter(c=>c.x<900);

 // when every required order resolved, finish
 if(G.spawned>=G.cfg.orders && G.resolved>=G.cfg.orders && !G.customers.some(c=>c.active)){
  finish(false);return;
 }

 updateHud();
}

/* =========================
   RENDER
========================= */
function render(){
 ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*ox,dpr*oy);
 ctx.clearRect(-ox/scale,-oy/scale,innerWidth/scale,innerHeight/scale);
 drawRestaurant();

 // customers
 if(G)G.customers.forEach(drawCustomer);

 // grill food
 if(G)G.grill.forEach((o,i)=>{
  if(!o)return;
  const x=205+i*45,y=302;
  drawIngredient(ctx,o.k,x,y,16);
  const progress=Math.min(1,o.t/4);
  ctx.strokeStyle=o.t<4?"#ffd34d":o.t<8.5?"#5fe08b":"#e84b3f";
  ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y-22,8,-Math.PI/2,-Math.PI/2+Math.PI*2*progress);ctx.stroke();
 });

 drawSandwich();

 // message
 if(G){
  roundRect(ctx,140,90,420,35,12,"#241108cc");
  ctx.fillStyle="#ffe8b0";ctx.font="800 14px Tajawal";ctx.textAlign="center";ctx.fillText(G.message,350,113);
 }

 // dragging
 if(pointer){
  const x=pointer.x,y=pointer.y;
  ctx.globalAlpha=.9;
  if(pointer.kind==="ingredient")drawIngredient(ctx,pointer.data,x,y,23,0);
  else if(pointer.kind==="grill"){
   const o=G.grill[pointer.data];
   if(o)drawIngredient(ctx,o.k,x,y,20,0);
  }
  else if(pointer.kind==="sandwich"){
   ctx.save();ctx.translate(x,y);ctx.scale(1.08,1.08);
   if(G.sandwich)drawSandwichAt(x,y);
   ctx.restore();
  }
  ctx.globalAlpha=1;
 }

 // particles
 particles.forEach(p=>{
  ctx.globalAlpha=Math.max(0,p.life);
  ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill();
 });
 ctx.globalAlpha=1;

 texts.forEach(t=>{
  ctx.globalAlpha=Math.max(0,t.life);
  ctx.fillStyle=t.color||"#ffd45b";ctx.font="800 20px Tajawal";ctx.fillText(t.text,t.x,t.y);
 });
 ctx.globalAlpha=1;
}

function drawSandwichAt(x,y){
 if(!G.sandwich)return;
 ctx.save();ctx.translate(x,y);
 ctx.fillStyle="#dba55b";ctx.strokeStyle="#8d5b22";ctx.lineWidth=3;
 ctx.beginPath();ctx.ellipse(0,0,95,27,0,0,7);ctx.fill();ctx.stroke();
 G.sandwich.items.forEach((it,i)=>{
  const px=it.px!==undefined?it.px:(i-1)*28;
  drawIngredient(ctx,it.k,px,it.py||0,10,it.rot);
 });
 ctx.restore();
}

function tickParticles(dt){
 particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=190*dt;p.life-=dt});
 particles=particles.filter(p=>p.life>0);
 texts.forEach(t=>{t.y-=25*dt;t.life-=dt});
 texts=texts.filter(t=>t.life>0);
}

/* =========================
   AUDIO
========================= */
let AC=null;
function audio(){
 try{
  if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume();
 }catch(e){}
}
function beep(freq,dur){
 if(!S.sfx)return;
 audio();if(!AC)return;
 const o=AC.createOscillator(),g=AC.createGain();
 o.frequency.value=freq;o.type="square";g.gain.value=.035;
 o.connect(g);g.connect(AC.destination);o.start();
 g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);
 o.stop(AC.currentTime+dur);
}

/* =========================
   LOOP
========================= */
function loop(ts){
 const dt=Math.min(.05,(ts-last)/1000||0);last=ts;clock+=dt;
 if(mode==="play")update(dt);
 tickParticles(dt);render();
 requestAnimationFrame(loop);
}
resize();requestAnimationFrame(loop);
</script>
