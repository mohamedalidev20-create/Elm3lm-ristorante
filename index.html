$('et').textContent=ok?'المرحلة خلصت!':to?'الوقت خلص! خسرت':'المرحلة ما خلصتش';$('es').innerHTML='الطلبات اللي خلصت: <b>'+g.served+'/'+g.total+'</b><br>الفلوس اللي كسبتها: <b>+'+g.earned+' جنيه</b><br>بونص السرعة: <b>+'+g.bonus+' جنيه</b><br>معاك دلوقتي: <b>'+S.money+' جنيه</b><br>الدقة: <b>'+Math.round(100*g.served/Math.max(1,g.served+g.wrong+g.lost))+'%</b>'+(nw?'<br><b>المرحلة الجاية اتفتحت!</b>':'')+(ok?'':'<br>لازم تخلص 60% من الطلبات على الأقل');
$('en').style.display=ok&&g.n<MAXL?'':'none';$('er').style.display=ok?'none':'';show('end');sfx(ok?'win':'bad');if(ok)for(let i=0;i<6;i++)setTimeout(()=>spark(100+Math.random()*600,150,pick(['#ffd54a','#5fd38a','#fff']),18,200),i*150)}

const LK='<svg viewBox="0 0 24 24" width="26" height="26"><rect x="5" y="11" width="14" height="10" rx="2" fill="#aaa"/><path d="M8 11V8a4 4 0 018 0v3" fill="none" stroke="#aaa" stroke-width="2.5"/></svg>';
function renderSel(){const gr=$('lg');gr.innerHTML='';for(let i=1;i<=MAXL;i++){const b=document.createElement('button'),lk=i>S.unlocked;b.className='lv'+(lk?' lk':'')+(S.newU==i?' pop':'');b.innerHTML=lk?LK:i+'<small>'+(i==S.unlocked?'العب':'خلّصتها')+'</small>';if(!lk)b.onclick=()=>{au();startLevel(i)};gr.append(b)}
$('lnote').textContent='عايز أكل جديد؟ اشتريه من التطويرات';S.newU=0;save()}
function renderUp(){$('um').innerHTML='معاك <b>'+S.money+'</b> جنيه';const u=$('ul');u.innerHTML='';UPS.forEach(([k,n,d,p,mx])=>{const lv=S.up[k],pr=p*(lv+1),cd=document.createElement('div');cd.className='card';cd.innerHTML='<div><b>'+n+'</b><small>'+d+'</small><span class="pips">'+'\u25A0'.repeat(lv)+'\u25A1'.repeat(mx-lv)+'</span></div>';const b=document.createElement('button');b.className='btn sm'+(lv>=mx?'':' g');b.textContent=lv>=mx?'خلاص اتطوّر':'اشتري بـ '+pr+' جنيه';b.onclick=()=>{if(lv>=mx||S.money<pr){sfx('bad');return}S.money-=pr;S.up[k]++;save();sfx('buy');spark(400,200,'#ffd54a',20);renderUp()};cd.append(b);u.append(cd)});
const hh=document.createElement('h2');hh.textContent='المكونات';u.append(hh);
Object.keys(PRICE).forEach(k=>{const own=S.own.includes(k),lk=!own&&S.unlocked<UNL[k],cd=document.createElement('div');cd.className='card';const c=document.createElement('canvas');c.width=c.height=44;ic(c.getContext('2d'),k,22,24,18);cd.append(c);const d=document.createElement('div');d.innerHTML='<b>'+ING[k][0]+'</b><small>'+(own?'معاك في المطعم':lk?'يتفتح لما توصل المرحلة '+UNL[k]:'مكون جديد للطلبات')+'</small>';cd.append(d);const b=document.createElement('button');b.className='btn sm'+(own||lk?'':' g');b.textContent=own?'اشتريته':lk?'مقفول':'اشتري بـ '+PRICE[k]+' جنيه';b.onclick=()=>{if(own||lk||S.money<PRICE[k]){sfx('bad');return}S.money-=PRICE[k];S.own.push(k);D.avail=av();save();sfx('buy');spark(400,200,'#ffd54a',20);renderUp()};cd.append(b);u.append(cd)})}
const renderSet=()=>{$('tm').textContent='الموسيقى: '+(S.music?'شغالة':'مقفولة');$('ts').textContent='مؤثرات اللعبة: '+(S.sfx?'شغالة':'مقفولة');$('sm').textContent={game:'الموسيقى: موسيقى اللعبة',mix:'الموسيقى: أغاني الموبايل',none:'الموسيقى: بدون (المؤثرات شغالة)'}[S.amode];plUI()};
const go=(id,f)=>{au();f&&f();show(id)};
$('mp').onclick=()=>{au();startLevel(Math.min(S.unlocked,MAXL))};$('ml').onclick=()=>go('sel',renderSel);$('mu').onclick=()=>go('upg',renderUp);$('ms').onclick=()=>go('set',renderSet);
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>show('menu'));
$('tm').onclick=()=>{S.music^=1;save();renderSet();playSong()};$('sm').onclick=()=>{const n={game:'mix',mix:'none',none:'game'}[S.amode];if(n=='mix'&&!PL.length){$('sf').click();return}S.amode=n;save();renderSet();playSong()};$('ts').onclick=()=>{S.sfx^=1;save();renderSet()};
let rt=0;$('rs').onclick=()=>{const b=$('rs');if(!rt){b.textContent='دوس تاني علشان تأكد';rt=setTimeout(()=>{rt=0;b.textContent='امسح التقدم'},3000)}else{clearTimeout(rt);rt=0;S=DEF();D.avail=av();save();b.textContent='التقدم اتمسح';setTimeout(()=>{b.textContent='امسح التقدم'},1500);renderSet()}};
$('en').onclick=()=>startLevel(G.n+1);$('er').onclick=()=>startLevel(G.n);$('el').onclick=()=>go('sel',renderSel);$('hx').onclick=()=>go('sel',renderSel);
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;T+=dt;if(mode=='play')upd(dt);
if(dg){dg.a=(dg.a||0)+dt;if(!dg.back&&dg.tx!=null){const k=Math.min(1,dt*20);dg.vx=(dg.tx-dg.x)*k;dg.x+=dg.vx;dg.y+=(dg.ty-dg.y)*k;if(Math.random()<.6)PT.push({x:dg.x+(Math.random()-.5)*16,y:dg.y-10,vx:0,vy:25,l:.5,c:'rgba(255,225,120,.85)',r:2})}}
if(dg&&dg.back){dg.bt+=dt*5;const e=Math.min(1,dg.bt);dg.x=lp(dg.x0,dg.hx,e);dg.y=lp(dg.y0,dg.hy,e);if(e>=1){if(dg.kind=='sand'&&G.sd)G.sd.hide=false;if(dg.gi!=null&&G.grill[dg.gi])G.grill[dg.gi].hold=false;dg=null}}
PT.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.l-=dt*.9});PT=PT.filter(p=>p.l>0);FL.forEach(f=>{f.y-=26*dt;f.l-=dt});FL=FL.filter(f=>f.l>0);
if(Math.random()<dt*3)PT.push({x:170+Math.random()*60,y:266,vx:0,vy:-30,l:.7,c:'rgba(255,255,255,.5)',r:3});
scene();requestAnimationFrame(loop)}

const idb=(m,v)=>new Promise(r=>{try{const q=indexedDB.open('moallem',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onerror=()=>r();q.onsuccess=()=>{const st=q.result.transaction('k',m=='get'?'readonly':'readwrite').objectStore('k'),rq=m=='get'?st.get('songs'):m=='put'?st.put(v,'songs'):st.delete('songs');rq.onsuccess=()=>r(rq.result);rq.onerror=()=>r()}}catch(e){r()}});
CA.volume=S.vol/100;$('vl').value=S.vol;CA.onended=()=>{loadTrack(pi+1);playSong()};
function loadTrack(i){if(!PL.length)return;pi=(i+PL.length)%PL.length;if(CA.src)URL.revokeObjectURL(CA.src);CA.src=URL.createObjectURL(PL[pi]);try{navigator.mediaSession.metadata=new MediaMetadata({title:PL[pi].name})}catch(e){}plUI()}
function setList(fs,keep){PL=fs;pi=0;loadTrack(0);if(keep){idb('put',fs);S.amode='mix';save()}renderSet();playSong()}

// daily reward
const dAmt=d=>Math.min(150,10*d),dAvail=()=>Date.now()>=S.daily.next,fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000)),p=n=>String(n).padStart(2,'0');return p(s/3600|0)+':'+p(s/60%60|0)+':'+p(s%60)};
function renderDay(){const base=(S.daily.day/7|0)*7+1,g=$('dg');g.innerHTML='';for(let i=0;i<7;i++){const d=base+i,c=document.createElement('div');c.className='dc'+(d<=S.daily.day?' dn':d==S.daily.day+1?' dcur':'');c.innerHTML='<small>يوم '+d+'</small><b>'+dAmt(d)+'</b><small>جنيه</small>'+(d<=S.daily.day?'<i>\u2713</i>':'');g.append(c)}dayTick()}

function burst(a){const w=document.createElement('div');w.className='burst';w.innerHTML='<div class="bt">+'+a+' جنيه</div>';for(let i=0;i<26;i++){const c=document.createElement('i');c.style.cssText='--x:'+((Math.random()-.5)*600|0)+'px;--y:'+(-(Math.random()*260+60)|0)+'px;animation-delay:'+(Math.random()*.3)+'s';w.append(c)}document.body.append(w);setTimeout(()=>w.remove(),2200)}
$('dcl').onclick=()=>{au();if(!dAvail())return;const amt=dAmt(S.daily.day+1),n=new Date();n.setHours(24,0,0,0);S.money+=amt;S.daily.day++;S.daily.next=n.getTime();save();sfx('win');setTimeout(()=>sfx('coin'),300);burst(amt);renderDay()};
